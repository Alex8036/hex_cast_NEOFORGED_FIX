plugins {
    id "java"
    id "org.jetbrains.kotlin.jvm"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":Common").loom.accessWidenerPath
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    // Базовая зависимость NeoForge
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // Architectury API
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    // Модуль Common (основной код мода)
    common(project(path: ":Common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":Common", configuration: "transformProductionNeoForge")) { transitive false }

    // 1. CURIOUS API (Исправляет текущую ошибку с LensCurioRenderer)
    modCompileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
    modRuntimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    // 2. PATCHOULI
    modCompileOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"
    modRuntimeOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"

    // 3. JEI
    modCompileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.2.313"
    modRuntimeOnly "mezz.jei:jei-1.21.1-neoforge:19.21.2.313"

    // 4. PEHKUI (Точные координаты Modrinth)
    modCompileOnly "maven.modrinth:t5W7Jfwy:nKHizsl6"
    modRuntimeOnly "maven.modrinth:t5W7Jfwy:nKHizsl6"

    // 5. CAELUS (Официальные координаты)
    modCompileOnly "com.illusivesoulworks.caelus:caelus-neoforge:7.0.1+1.21.1:api"
    modRuntimeOnly "com.illusivesoulworks.caelus:caelus-neoforge:7.0.1+1.21.1"

    // 6. PAUCAL (Точные координаты Modrinth)
    modCompileOnly "maven.modrinth:TZo2wHFe:zgpdzVKd"
    modRuntimeOnly "maven.modrinth:TZo2wHFe:zgpdzVKd"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}