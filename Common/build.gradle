plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "org.jetbrains.kotlin.jvm"
}

architectury {
    common("fabric", "neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/hexplat.accesswidener")
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" } // Явный репозиторий Modrinth
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.blamejared.com" }
}

configurations {
    namedElements {
        attributes {
            attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                      objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_RUNTIME))
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // Patchouli
    modCompileOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"

    // Paucal — используем номер версии вместо ID
    modCompileOnly "maven.modrinth:TZo2wHFe:0.7.0+neoforge-1.21.1"
}

// Исключаем datagen, чтобы обойти ошибки API 1.21
sourceSets.main.java.exclude '**/datagen/**'
sourceSets.main.kotlin.exclude '**/datagen/**'