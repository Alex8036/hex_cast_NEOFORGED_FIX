plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "org.jetbrains.kotlin.jvm"
}

architectury {
    // ИСПРАВЛЕНО: указываем neoforge, а не forge
    common("neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/hexplat.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()

    // Fabric Loader оставляем — он нужен для аннотаций @Environment в общем коде
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
}