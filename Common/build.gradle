plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "org.jetbrains.kotlin.jvm"
}

architectury {
    common("fabric", "neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/hexplat.accesswidener")
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url 'https://maven.blamejared.com' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

configurations {
    namedElements {
        attributes {
            attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                      objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_RUNTIME))
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // ДОБАВЛЯЕМ БИБЛИОТЕКИ, КОТОРЫХ НЕ ХВАТАЛО
    modCompileOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"
    modCompileOnly "maven.modrinth:TZo2wHFe:zgpdzVKd" // Paucal
}

// ИСКЛЮЧАЕМ DATAGEN, ЧТОБЫ ОБОЙТИ ОШИБКИ API 1.21
sourceSets.main.java.exclude '**/datagen/**'
sourceSets.main.kotlin.exclude '**/datagen/**'