plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "org.jetbrains.kotlin.jvm"
}

architectury {
    // Указываем оба загрузчика для общего модуля
    common("fabric", "neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/hexplat.accesswidener")
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

// 👇 ДОБАВЛЕНО: делаем namedElements уникальной конфигурацией
configurations {
    namedElements {
        attributes {
            attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                      objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_RUNTIME))
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()

    // Fabric Loader нужен для общих аннотаций
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // NeoForge для общего модуля
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
}