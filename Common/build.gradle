plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "org.jetbrains.kotlin.jvm"
}

architectury {
    // Указываем, что этот модуль общий для платформы forge (NeoForge)
    common("forge")
}

loom {
    accessWidenerPath = file("src/main/resources/hexcasting.accesswidener")
}

dependencies {
    // Самое важное: указываем версию Minecraft и маппинги
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()

    // Fabric Loader нужен для аннотаций @Environment в общем коде
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Если в Common нужны другие общие библиотеки, добавь их сюда
}