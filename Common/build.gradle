plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "org.jetbrains.kotlin.jvm"
}

architectury {
    // ИСПОЛЬЗУЕМ СПИСОК ИЗ gradle.properties
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/hexplat.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()

    // Fabric Loader нужен для общих аннотаций
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Зависимости для компиляции общего кода (без загрузчиков)
    modCompileOnly "at.petra-k.paucal:paucal:${project.paucal_version}+${rootProject.minecraftVersion}-common"
    modCompileOnly "vazkii.patchouli:Patchouli-xplat:1.21-${project.patchouli_version}-SNAPSHOT"
    modCompileOnly "dev.emi:emi-api:${project.emi_version}"
}