buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath group: 'com.diluv.schoomp', name: 'Schoomp', version: '1.2.6'
    }
}

plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm" version "2.0.20"
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id("at.petra-k.PKPlugin") version "0.1.0-pre-87"
    id("at.petra-k.PKSubprojPlugin") version "0.1.0-pre-87" apply false
}

repositories {
    mavenCentral()
    maven { url 'https://api.modrinth.com/maven' } // Главный источник для модов
    maven { url 'https://maven.blamejared.com' }   // Резерв для Patchouli/JEI
    maven { url 'https://maven.theillusivec4.top/' }
}

pkpcpbp {
    modInfo {
        modID(project.modID)
        mcVersion(project.minecraftVersion)
        modVersion(project.modVersion)
    }
    curseforgeInfo {
        id 569849
        stability "beta"
        token(System.getenv("CURSEFORGE_TOKEN"))
    }
    modrinthInfo {
        id "nTW3yKrm"
        stability "beta"
        token(System.getenv("MODRINTH_TOKEN"))
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'maven-publish'

    repositories {
        mavenCentral()
        maven { url 'https://api.modrinth.com/maven' }
        maven { url 'https://maven.blamejared.com' }
        maven { url 'https://maven.theillusivec4.top/' }
    }

    dependencies {
        // Все зависимости через Modrinth (самый надежный способ для облака)
        compileOnly "maven.modrinth:patchouli:1.21.1-93-neoforge"
        runtimeOnly "maven.modrinth:patchouli:1.21.1-93-neoforge"

        compileOnly "maven.modrinth:jei:19.21.2.313"
        runtimeOnly "maven.modrinth:jei:19.21.2.313"

        compileOnly "maven.modrinth:caelus:7.0.1+1.21.1"
        runtimeOnly "maven.modrinth:caelus:7.0.1+1.21.1"

        compileOnly "maven.modrinth:pehkui:3.8.3+1.21-neoforge"
        runtimeOnly "maven.modrinth:pehkui:3.8.3+1.21-neoforge"
        
        compileOnly "maven.modrinth:paucal:0.7.0+neoforge-1.21.1"
        runtimeOnly "maven.modrinth:paucal:0.7.0+neoforge-1.21.1"
    }

    def javaToolchains = extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)

    tasks.withType(JavaCompile).configureEach {
        it.javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
        it.options.encoding = 'UTF-8'
        it.options.release = 21
        it.sourceCompatibility = JavaVersion.VERSION_21.toString()
        it.targetCompatibility = JavaVersion.VERSION_21.toString()
    }

    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    sourceSets.main.kotlin.srcDirs += 'src/main/java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        withSourcesJar()
        withJavadocJar()
    }

    kotlin {
        jvmToolchain(21)
    }

    configurations.configureEach {
        attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    // Решение проблемы с дубликатами JSON
    processResources {
        exclude '.cache'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    sourcesJar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude "META-INF/neoforge.mods.toml"
    }
}

allprojects {
    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    tasks.register("runAllDatagen") {
        dependsOn ":Forge:runXplatDatagen"
        dependsOn ":Forge:runForgeDatagen"
    }
}
