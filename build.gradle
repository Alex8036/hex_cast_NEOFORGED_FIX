buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath group: 'com.diluv.schoomp', name: 'Schoomp', version: '1.2.6'
    }
}

plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm" version "2.0.20"
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id("at.petra-k.PKPlugin") version "0.1.0-pre-87"
    id("at.petra-k.PKSubprojPlugin") version "0.1.0-pre-87" apply false
}

repositories {
    mavenCentral()
    maven { url 'https://maven.blamejared.com' } // Patchouli + JEI
    maven { url 'https://maven.theillusivec4.top/' } // Caelus
    maven { url 'https://api.modrinth.com/maven' } // Pehkui
}

pkpcpbp {
    modInfo {
        modID(project.modID)
        mcVersion(project.minecraftVersion)
        modVersion(project.modVersion)
    }
    curseforgeInfo {
        id 569849
        stability "beta"
        token(System.getenv("CURSEFORGE_TOKEN"))
    }
    modrinthInfo {
        id "nTW3yKrm"
        stability "beta"
        token(System.getenv("MODRINTH_TOKEN"))
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'maven-publish'

    // 👇 ДОБАВЛЯЕМ РЕПОЗИТОРИИ ДЛЯ КАЖДОГО МОДУЛЯ 👇
    repositories {
        mavenCentral()
        maven { url 'https://maven.blamejared.com' }
        maven { url 'https://maven.theillusivec4.top/' }
        maven { url 'https://api.modrinth.com/maven' }
    }

    dependencies {
        // 👇 ВОТ ОНИ, НАШИ ЗАВИСИМОСТИ 👇
        // Patchouli (нужен для компиляции и в рантайме)
        compileOnly "vazkii.patchouli:patchouli-neoforge:1.21.1-93:api"
        runtimeOnly "vazkii.patchouli:patchouli-neoforge:1.21.1-93"

        // JEI (только API для компиляции, полный JAR для тестов)
        compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.52.0.422"
        runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.52.0.422"

        // Caelus (для полета)
        compileOnly "com.illusivesoulworks.caelus:caelus-neoforge:7.0.1+1.21.1:api"
        runtimeOnly "com.illusivesoulworks.caelus:caelus-neoforge:7.0.1+1.21.1"

        // Pehkui (для изменения размера)
        implementation "maven.modrinth:pehkui:3.8.3+1.21-neoforge"
    }

    def javaToolchains = extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)

    tasks.withType(JavaCompile).configureEach {
        it.javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
        it.options.encoding = 'UTF-8'
        it.options.release = 21
        it.sourceCompatibility = JavaVersion.VERSION_21.toString()
        it.targetCompatibility = JavaVersion.VERSION_21.toString()
    }

    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    sourceSets.main.kotlin.srcDirs += 'src/main/java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        withSourcesJar()
        withJavadocJar()
    }

    kotlin {
        jvmToolchain(21)
    }

    configurations.configureEach {
        attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    processResources {
        exclude '.cache'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    sourcesJar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude "META-INF/neoforge.mods.toml"
    }
}

allprojects {
    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    tasks.register("runAllDatagen") {
        dependsOn ":Forge:runXplatDatagen"
        dependsOn ":Forge:runForgeDatagen"
    }
}