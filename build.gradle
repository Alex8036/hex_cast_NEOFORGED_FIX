buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath group: 'com.diluv.schoomp', name: 'Schoomp', version: '1.2.6'
    }
}

plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm"
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id("at.petra-k.PKPlugin") version "0.1.0-pre-87"
    id("at.petra-k.PKSubprojPlugin") version "0.1.0-pre-87" apply false
}

repositories {
    mavenCentral()
    maven { url 'https://maven.blamejared.com' }
}

pkpcpbp {
    modInfo {
        modID(project.modID)
        mcVersion(project.minecraftVersion)
        modVersion(project.modVersion)
    }
    curseforgeInfo {
        id 569849
        stability "beta"
        token(System.getenv("CURSEFORGE_TOKEN"))
    }
    modrinthInfo {
        id "nTW3yKrm"
        stability "beta"
        token(System.getenv("MODRINTH_TOKEN"))
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'kotlin'
    apply plugin: 'maven-publish'

    def javaToolchains = extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)

    tasks.withType(JavaCompile).configureEach {
        it.javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
        it.options.encoding = 'UTF-8'
        it.options.release = 21
        it.sourceCompatibility = JavaVersion.VERSION_21.toString()
        it.targetCompatibility = JavaVersion.VERSION_21.toString()
    }

    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    sourceSets.main.kotlin.srcDirs += 'src/main/java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        withSourcesJar()
        withJavadocJar()
    }

    kotlin {
        jvmToolchain(21)
    }

    configurations.configureEach {
        attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    processResources {
        exclude '.cache'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    sourcesJar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude "META-INF/neoforge.mods.toml"
    }
}

allprojects {
    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }

    compileKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    compileTestKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    tasks.register("runAllDatagen") {
        dependsOn ":Forge:runXplatDatagen"
        dependsOn ":Forge:runForgeDatagen"
    }
}